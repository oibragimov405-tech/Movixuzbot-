app = "movixuzbot-1"
primary_region = "ams"

[build]
  builder = "paketobuildpacks/builder:base"

[processes]
  app = "python bot.py"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.alive]
    type = "tcp"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    port = 8080
